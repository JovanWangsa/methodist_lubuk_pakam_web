name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  web:
    name: Laravel (lint, build, tes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Cek gaya kode (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Build aset (Vite)
        run: |
          npm ci
          npm run build

      - name: Jalankan tes
        run: php artisan test

  api:
    name: Express (lint, tes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test
