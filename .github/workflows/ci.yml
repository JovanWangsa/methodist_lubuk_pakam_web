name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  web:
    name: Laravel (gaya kode, CSS, tes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Sama dengan versi PHP minimal di hosting cPanel sekolah.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_sqlite
          coverage: none

      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Cek gaya kode (Laravel Pint)
        run: vendor/bin/pint --test

      # Website memakai CSS jadi (public/css/situs.css) tanpa npm. Langkah ini membuat ulang
      # CSS dengan Tailwind CLI standalone dan gagal bila file di repo belum diperbarui.
      - name: Cek CSS Tailwind sudah dibuat ulang
        run: |
          curl -sSL -o /tmp/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -i resources/css/app.css -o public/css/situs.css --minify
          git diff --exit-code -- public/css/situs.css || (echo "::error::public/css/situs.css belum dibuat ulang. Jalankan Tailwind CLI (lihat README bagian Mengubah tampilan) lalu commit hasilnya." && exit 1)

      - name: Jalankan tes
        run: php artisan test
