# Website Laravel. Salin ke /etc/nginx/sites-available/ lalu aktifkan (lihat deploy/README.md).
# Certbot akan menambahkan blok HTTPS (listen 443) secara otomatis.
server {
    listen 80;
    listen [::]:80;
    server_name methodistpakam.sch.id www.methodistpakam.sch.id;

    root /var/www/methodist_lubuk_pakam_web/web/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Aset Vite memakai nama ber-hash, aman di-cache 1 tahun.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:webp|avif|jpg|jpeg|png|svg|ico|woff2)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Tolak file tersembunyi (.env, .git) dan file PHP lain.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
